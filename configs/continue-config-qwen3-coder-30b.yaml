# Continue 插件配置 — Qwen3-Coder-30B-A3B（Kaggle vLLM 版）
# 模型跑在 Kaggle 会话里的 vLLM OpenAI 兼容服务上（http://localhost:8000/v1），
# Continue 也装在隧道内的 VS Code 里，所以 apiBase 用隧道内的 localhost:8000/v1，不用暴露到公网。
# vLLM 不校验 key，apiKey 填任意占位值即可。
name: Kaggle Qwen3 Coder 30B
version: 1.0.0
schema: v1
context:
  - provider: code
  - provider: docs
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder
  - provider: codebase
models:
  - name: Qwen3-Coder-30B-A3B (Kaggle vLLM)
    provider: openai
    model: qwen3-coder-30b
    apiBase: http://localhost:8000/v1
    apiKey: sk-kaggle-local
    roles:
      - chat
      - edit
      - apply
